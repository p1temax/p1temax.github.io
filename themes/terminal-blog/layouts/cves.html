{{ define "main" }}
  <div class="page-intro">
    <h1>{{ .Title }}</h1>
    <div class="blog-content">{{ .Content }}</div>
  </div>
  <div class="card-grid">
    {{ range hugo.Data.cves }}
      <article class="panel">
        <div class="section-title">
          <h2>{{ .id }}</h2>
          <span class="badge badge-cve">{{ .severity }}</span>
        </div>
        <div class="meta">{{ .year }} · {{ .type }} · {{ .product }}</div>
        <p class="muted">{{ .description }}</p>
        {{ with .link }}<a href="{{ . }}">Advisory →</a>{{ end }}
      </article>
    {{ end }}
  </div>
{{ end }}
