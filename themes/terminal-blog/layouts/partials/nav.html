<nav class="nav">
  <div class="container nav-inner">
    <div class="nav-left">
      <a class="prompt" href="{{ "/" | relURL }}">{{ partial "prompt.html" . }}</a>
      <div class="nav-links">
        {{ range site.Menus.main }}
          {{ $href := .URL | relURL }}
          {{ $here := $.RelPermalink }}
          {{ $on := or (eq $here $href) (and (ne $href "/") (hasPrefix $here $href)) }}
          <a href="{{ $href }}"{{ if $on }} class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </div>
    </div>
    <div class="nav-social">
      <button type="button" class="search-open" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="kbd">⌘K</span>
      </button>
      {{ with site.Params.github }}
        <a href="{{ . }}" aria-label="GitHub"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.6 0 0 3.6 0 8c0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1.1-2.7-1.1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.3.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.2-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.5 7.5 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.2 0 3.1-1.9 3.7-3.7 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.5.4A8 8 0 0 0 16 8c0-4.4-3.6-8-8-8z"/></svg></a>
      {{ end }}
    </div>
    <button type="button" class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">Menu</button>
  </div>
</nav>
