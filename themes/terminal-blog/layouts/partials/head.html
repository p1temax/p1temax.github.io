<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ partial "theme-boot.html" . }}
<title>
  {{- $prompt := partial "prompt.html" . -}}
  {{- if .IsHome -}}
    {{- $prompt }} Command Line to Front Line
  {{- else -}}
    {{- $prompt }} {{ .Title -}}
  {{- end -}}
</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<meta name="theme-color" content="#f4efe4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/chroma.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/chroma-dark.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
{{ with site.Home.OutputFormats.Get "RSS" }}
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">
{{ end }}
